<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal CFO</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />

       Identity Services library, used solely for the OAuth login flow. -->

</head>
<body>
  <div class="app-shell">
    <aside id="sidebar">
      <div class="sidebar-brand">Personal CFO</div>

        <button data-route="simulator"><span class="nav-icon">🎯</span>סימולטור יעדים</button>
        <button id="sign-out-btn"><span class="nav-icon">🚪</span>התנתקות</button>
      </nav>
    </aside>

    <main id="app-root">
      <p>טוען...</p>
    </main>

  <script type="module" src="js/app.js"></script>

</html>
